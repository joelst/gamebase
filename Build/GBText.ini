Tips=Tips
Main_RunningGames_Title=Running Games
Main_PlayingMusic_Title=Playing Music
Main_DetailsTabs_Title=The Details Tabs
Main_Pictures_Title=Game Pictures
Picture_Selector_Title=The Picture Selector
Linking_Games_Title=Setting up Game Links
TestGame_Flag_Title=Testing Games
Edit_Extras_Title=Game Extras
Picture_Style_Title=GB/MAME Picture Style

;NOTE: Placing ~BL~ in the tip text will insert a blank line

Main_RunningGames=Left-clicking the Play Game button will run the game in the first emulator that supports it's file-type.~BL~Right-clicking the button will display a list of available emulators to choose from!~BL~You can also press Space to run the game once you've selected it in the list.

Main_PlayingMusic=Left-clicking the Play Music button will play the music file in the first player that supports it's file-type.~BL~Right-clicking the button will display a list of available players to choose from!~BL~You can also press Enter to play the music file once you've selected it in the list.

Main_DetailsTabs=You can use the function keys F5 to F9 to switch between the Details Tabs!

Main_Pictures=Clicking on the left-hand side of a Picture will zoom in.~BL~Clicking on the right-hand side of Pictures will scroll through them (you can also press F11/F12 to scroll).~BL~Right-click a Picture for more options.

Picture_Selector=Use Drag/Drop to place picture files into your Pictures Path.~BL~Holding SHIFT or CTRL whilst dragging will Copy the file.  Holding down neither of these keys will Move the file.~BL~Click the Picture Selector's Help button for more info.

Linking_Games=You can setup links to a game's Precursor, Sequel or Related game by first 'Marking' a game with CTRL+C, then clicking on the game you wish to link it to and pressing CTRL+V.~BL~You can use the 'Related Game' link to setup circular links between multiple games.~BL~E.g.  Game1 --> Game2 --> Game3 --> Game1

TestGame_Flag=Some settings, such as whether a game is PAL or NTSC compliant, cannot be determined simply by looking at the game file.~BL~Clicking the small checkbox by the 'Test' button will allow you to enter these settings before GEMUS runs the game in the specified emulator.

Edit_Extras=Game Extras are additional files that you can associate with a game!~BL~You can setup these files as 'NORMAL' Extras (i.e. they run with their default program) or you can setup additional game-files for a game by specifying that an Extra should use 'GEMUS' to run it.

Picture_Style=There are 2 'styles' that GameBase can use for displaying pictures: -~BL~The 'GameBase' style (e.g. 'pic.gif', 'pic_1.gif', 'pic_2.gif' etc. until no more can be found in your Picture Paths).~BL~The 'MAME' style (e.g. 'pic.png' is searched for in each Picture Path and displayed if found).

