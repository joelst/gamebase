name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build GameBase
        run: dotnet build src/GameBase/GameBase.csproj --configuration Release --no-restore

      - name: Build GBMigrator
        run: dotnet build src/GBMigrator/GBMigrator.csproj --configuration Release --no-restore

      - name: Test GBSql.Tests
        run: dotnet test tests/GBSql.Tests/GBSql.Tests.csproj --configuration Release --no-build

      - name: Test Gemus.Tests
        run: dotnet test tests/Gemus.Tests/Gemus.Tests.csproj --configuration Release --no-build
